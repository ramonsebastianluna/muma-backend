version: '3.8'

services:
  node_backend:
    build: .
    ports:
      - '9000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - mongodb
    env_file:
      - .env

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
